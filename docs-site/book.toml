[book]
title = "Nivis"
description = "Terraform providers as first-class Nix values."
authors = ["Pim Snel"]
language = "en"
src = "src"

[output.html]
# Brand theme lives in ./theme (custom.css/head.hbs override the defaults).
# Served from the root of docs.nivis.tf (GitHub Pages custom domain).
site-url = "/"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = false
additional-css = ["theme/custom.css"]

git-repository-url = "https://github.com/nivis-project/nivis"
edit-url-template = "https://github.com/nivis-project/nivis/edit/main/docs-site/{path}"

[output.html.playground]
runnable = false

[output.html.search]
enable = true
