# Cut a GitHub release when a v* tag is pushed (scripts/release.sh pushes the tag).
# goreleaser cross-builds the nivis CLI, writes checksums and changelog notes, and
# creates the release with the artifacts attached.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release + upload artifacts

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags, so goreleaser can build notes

      - uses: actions/setup-go@v6
        with:
          # Must satisfy go.mod's `go` directive (a dep requires >= 1.25).
          go-version: "1.25"
          check-latest: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
