# goreleaser config — builds the nivis CLI (codegen is the `nivis gen`
# subcommand) and cuts a GitHub release on a v* tag (driven by
# .github/workflows/release.yml). The version comes from the tag and is injected
# into main.version (matching the Nix flake's -ldflags). Validate locally with
# `goreleaser check`; dry-run with `goreleaser release --snapshot --clean`.
version: 2

project_name: nivis

before:
  hooks:
    - go mod download

builds:
  - id: nivis
    main: ./cmd/nivis
    binary: nivis
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    ids: [nivis]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: "checksums.txt"

changelog:
  # Release notes from the commit log since the previous tag.
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge "

release:
  github:
    owner: nivis-project
    name: nivis
  name_template: "Nivis {{ .Tag }}"
  draft: false
  # `auto` keys off a SEMVER PRE-RELEASE SUFFIX in the tag (v1.0.0-rc1,
  # v0.8.0-beta), not off the major version. A plain v0.x tag has no suffix,
  # so 0.x releases are published as normal releases — which is how every
  # release up to v0.7.0 went out. Pre-1.0 status is signalled by the version
  # number itself. To flag a release, tag it with a suffix.
  prerelease: auto
